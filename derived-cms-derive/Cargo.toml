[package]
name = "derived-cms-derive"
version = "0.5.3"
authors = ["Valentin Leistner <git@valentinleistner.com>"]
description = "Macros implementation for derived-cms"
edition = "2021"
keywords = ["framework", "cms", "web", "derive"]
license = "MPL-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
convert_case = "0.8.0"
darling = "0.20.11"
proc-macro-crate = "3.3.0"
proc-macro2 = "1.0.95"
quote = "1.0.40"
syn = { version = "2.0.101", features = ["full"] }

[lib]
proc-macro = true
